name: E2E Tests

on:
  push:
  pull_request:

permissions: {}

jobs:
  test-e2e:
    permissions:
      contents: read
    name: Run on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: go.mod

      - name: Install the latest version of kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/latest/kind-linux-$(go env GOARCH)
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The matcher image holds the vulnerability database and weighs 3.5 GB. The Docker daemon holds it and the
      # layers that built it, and the kind node holds a second copy and the database that the matcher copies
      # into its volume. That is more than the runner has free, so this removes toolchains that the job
      # doesn't use.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Running Test e2e
        env:
          # The matcher runs offline in the cluster, so its image holds the database.
          MATCHER_DB: "true"
          # The tests don't use cert-manager.
          CERT_MANAGER_INSTALL_SKIP: "true"
        run: |
          go mod tidy
          make test-e2e
