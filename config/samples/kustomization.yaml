## Append samples of your project ##
resources:
- config_v1alpha1_operatorconfig.yaml
- config_v1alpha1_collectorruntimeconfig.yaml
- config_v1alpha1_modelconfig.yaml
- config_v1alpha1_modelconfig_secret.yaml
# config_v1alpha1_collector.yaml and config_v1alpha1_collector_scanner.yaml are not listed on purpose. They
# show the Collectors workloads and scanner, which the install ships under the same names, so applying
# them would change the install's. The files stay as documentation of the shape and of the settings.
# config_v1alpha1_playbook.yaml and config_v1alpha1_rule.yaml are not listed on purpose. They show the
# default playbook and one of its rules, which the install ships, and a second playbook with the same
# subjects is in Conflict. The files stay as documentation of the shape.
# inventory_v1alpha1_imageinventory.yaml is not listed on purpose. The operator owns the
# ImageInventory objects and deletes those that no pod runs, so an applied sample would be gone at
# once. The file stays as documentation of the shape.
# Evidence, ImageVerdicts and WorkloadReport have no sample at all: the operator writes them, and an
# Evidence holds gzipped evidence that no one writes by hand.
# +kubebuilder:scaffold:manifestskustomizesamples
