apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Collector
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  # The scanner collector scans image digests, in a scan Job for each.
  name: scanner
spec:
  package: artifacts.example/vexplain/scanner:0.1.0
  # settings are the scanner's own. The API server keeps them as they are, and the scanner checks them against the
  # schema that it declares, and with its own check. These are the ones that say how its scan Jobs run, with their
  # defaults. A setting that is left out takes its default, and one outside its range is refused.
  settings:
    # maxConcurrentScans is how many scan Jobs may run at once, from 1 to 16: vexplain asks a collector for at most
    # 16 scans at once.
    maxConcurrentScans: 4
    # scanTimeoutSeconds is how long a scan Job may run before it is stopped, from 60 to 21600.
    scanTimeoutSeconds: 1800
    # workspaceMebibytes is the size of the scratch volume an image is unpacked into, and so the largest unpacked
    # image a scan accepts, from 1024 to 1048576.
    workspaceMebibytes: 10240
    # registryMirrors are mirrors that a scan pulls from in place of a registry, with the same repository path and
    # digest, and none by default, such as:
    #   - host: artifacts.example
    #     url: https://mirror.example
    registryMirrors: []
    # adminPullSecrets name Secrets of the type kubernetes.io/dockerconfigjson in vexplain's namespace, at most 16. A
    # scan tries their logins for the registry that it pulls from after those of the pull secrets of the pod and of
    # its service account, in this order, until the registry takes one. None by default, such as:
    #   - registry-a
    adminPullSecrets: []
    # scanPod shapes the pods of the scan Jobs, with the SDK's standard pod template: their pull policy, resources,
    # placement, labels and annotations. Without resources, a scan pod requests 2 GiB of memory, which is also its
    # limit.
    scanPod:
      imagePullPolicy: IfNotPresent
      resources:
        requests:
          memory: 2Gi
        limits:
          memory: 2Gi
