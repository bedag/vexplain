apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Collector
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  # The scanner collector scans image digests, in a scan Job for each.
  name: scanner
spec:
  package: artifacts.example/vexplain/scanner:0.1.0
  # settings are the scanner's own. The API server keeps them as they are, and the scanner checks
  # them. These are the four that say how its scan Jobs run, with their defaults. A setting that is
  # left out takes its default, and one outside its range is refused.
  settings:
    # maxConcurrentScans is how many scan Jobs may run at once, from 1 to 32.
    maxConcurrentScans: 2
    # scanTimeoutSeconds is how long a scan Job may run before it is stopped, from 60 to 21600.
    scanTimeoutSeconds: 1800
    # memoryLimitMebibytes is the memory limit of a scan Job's container, from 256 to 65536.
    memoryLimitMebibytes: 2048
    # workspaceMebibytes is the size of the scratch volume an image is unpacked into, and so the
    # largest unpacked image a scan accepts, from 1024 to 1048576.
    workspaceMebibytes: 10240
