apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: OperatorConfig
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  # OperatorConfig is a singleton: the API server rejects any other name.
  name: default
spec:
  # clusterName names this cluster in metrics and in inventory entries. It defaults to local.
  clusterName: local
  # scope limits which pods are analysed. Without it, every pod is analysed. An exclude selector
  # must not be empty. For example, to skip the namespaces labelled team=team-a:
  # scope:
  #   excludeNamespaces:
  #     matchLabels:
  #       team: team-a
  # clusterLabels describe this cluster, for the playbooks that apply to clusters with certain
  # labels. They are never passed to collectors. At most 32 labels.
  # clusterLabels:
  #   environment: production
  # collectors sets the policy on the permissions that collectors declare.
  # collectors:
  #   # Grant (the default) grants the declared permissions within the ceiling and outside the
  #   # deny list. Check grants nothing and only checks that the service account holds them.
  #   permissions: Grant
  #   # deniedPermissions are never granted. Without the field, listing and watching secrets is
  #   # denied. An empty list denies nothing.
  #   deniedPermissions:
  #     - apiGroups: [""]
  #       resources: [secrets]
  #       verbs: [list, watch]
