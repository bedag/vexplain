apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Playbook
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  # This is the playbook for containers. It is the default of the install, and so is not listed in
  # kustomization.yaml: a second playbook that takes the same subjects is in Conflict. A Playbook is named
  # with a DNS-1123 label of at most 63 characters.
  name: container-cves
spec:
  # subjects say where the subjects come from: the evidence of one type. Each image that presence
  # reports is assessed.
  subjects:
    type: ch.bedag.vexplain.presence.v1alpha1
  # findings say which type of findings the pipeline decides about. The type defaults to this one, the
  # vulnerabilities in packages.
  findings:
    type: ch.bedag.vexplain.findings.v1alpha1
  # evidence is what the playbook gathers for each subject, each piece of another type. The rules of the
  # pipeline get it under these names, which are CEL identifiers. Every Collector that produces a type
  # counts: the evidence of each is evaluated, and the most cautious outcome wins.
  evidence:
  - name: contents
    type: ch.bedag.vexplain.scanner.image-contents.v1alpha1
    # requirement is Required unless it says Optional: without a producer of the type, a Collector whose
    # capabilities declare it, the playbook isn't Ready. A producer's health doesn't matter. Optional evidence
    # keeps the playbook Ready without one, and its rules see it as missing. Evidence that a findings
    # producer consumes, as the vulnerabilities collector does the sbom below, is required all the same: its
    # match needs it.
    requirement: Required
    # collectors would pin the producers by the names of their Collectors, such as [scanner]: then only
    # those count, and each must exist and declare the type.
  - name: sbom
    type: ch.bedag.vexplain.sbom.v1alpha1
  # pipeline is the steps, each of which runs a Rule. When several steps apply to one finding, the
  # most cautious status wins, so the order doesn't change the result.
  pipeline:
  - rule: known-exploited
  - rule: completeness-guard
  - rule: removed-in-later-layer
  - rule: load-check
