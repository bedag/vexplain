apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Collector
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  # A Collector is named with a DNS-1123 label, at most 63 characters and no dots: playbooks name the
  # collectors that they read, and the operator names the Deployment, the Service and the service
  # account of the collector after it. The workloads collector reports which workloads run which
  # image digests.
  name: workloads
spec:
  # package is the OCI image that holds the collector, by tag or by digest. Upgrading the collector
  # means changing it, and changing it back is the rollback.
  package: artifacts.example/vexplain/workloads:0.1.0
  # runtimeConfigRef names the CollectorRuntimeConfig that shapes the collector's Deployment. Without
  # it, the config named default applies.
  # runtimeConfigRef:
  #   name: default
  # settings are the collector's own, an object of any shape. The workloads collector has none yet.
