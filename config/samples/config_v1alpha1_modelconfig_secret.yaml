apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
    # The operator reads only the Secrets that carry this label. A ModelConfig that names a Secret
    # without it reports SecretNotFound.
    vexplain.bedag.ch/llm-api-key: "true"
  name: llm-api-key
  # The operator's namespace: a ModelConfig can only use a Secret there.
  namespace: vexplain-system
type: Opaque
stringData:
  # Replace the placeholder with the API key of the endpoint. Whitespace around it is ignored.
  api-key: replace-me
