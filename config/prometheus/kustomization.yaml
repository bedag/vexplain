# What a Prometheus Operator needs to scrape the manager, the agent workers and the collectors. The ServiceMonitor kind
# comes with the Prometheus Operator's CRDs, so config/default names this directory in its [PROMETHEUS] section,
# commented out: where the Prometheus Operator runs, uncomment that line.
resources:
- service_account.yaml
- token_secret.yaml
- role_binding.yaml
- monitor.yaml

# kustomize's name prefix doesn't reach the names that a ServiceMonitor or an annotation holds by itself.
configurations:
- kustomizeconfig.yaml
