# A long-lived token of metrics-scraper. A ServiceMonitor can read a token from a Secret of its namespace, which
# managed Prometheus setups accept, where they refuse the token file of the scraper's own pod.
apiVersion: v1
kind: Secret
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  annotations:
    kubernetes.io/service-account.name: metrics-scraper
  name: metrics-scraper-token
  namespace: system
type: kubernetes.io/service-account-token
