# The manager's and the agent workers' metrics are served over TLS on 8443, with a certificate that the manager signs
# itself, so that the scrape skips its verification. The token is read from the Secret of token_secret.yaml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager
  namespace: system
spec:
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    authorization:
      credentials:
        name: metrics-scraper-token
        key: token
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vexplain
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/component: agent
    app.kubernetes.io/managed-by: kustomize
  name: agent
  namespace: system
spec:
  endpoints:
  - path: /metrics
    port: https
    scheme: https
    authorization:
      credentials:
        name: metrics-scraper-token
        key: token
    tlsConfig:
      insecureSkipVerify: true
  selector:
    matchLabels:
      app.kubernetes.io/name: vexplain
      app.kubernetes.io/component: agent
---
# The collectors serve /metrics on their plain HTTP port, 8081, without a token. The operator labels the Service of
# every Collector with vexplain.bedag.ch/collector.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: collectors
  namespace: system
spec:
  endpoints:
  - path: /metrics
    port: http
    scheme: http
  selector:
    matchExpressions:
    - key: vexplain.bedag.ch/collector
      operator: Exists
