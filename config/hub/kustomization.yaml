# A hub's install: the single-cluster install with the manager in Hub mode, and without the collectors that need the
# cluster the hub serves from: it runs no presence and no network reach of its own, and judges the copies of the
# spokes' records (docs/remote-spokes.md).
resources:
- ../default

patches:
- path: manager_mode_patch.yaml
  target:
    kind: Deployment
    name: vexplain-controller-manager
- patch: |-
    $patch: delete
    apiVersion: config.vexplain.bedag.ch/v1alpha1
    kind: Collector
    metadata:
      name: workloads
- patch: |-
    $patch: delete
    apiVersion: config.vexplain.bedag.ch/v1alpha1
    kind: Collector
    metadata:
      name: network-reach
