# The matcher answers whoever sends it an SBOM, and it is reached over plain HTTP. Only the manager's pods may
# (decision 0022).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-manager-to-matcher
  namespace: system
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/component: matcher
    app.kubernetes.io/managed-by: kustomize
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vexplain
      app.kubernetes.io/component: matcher
  policyTypes:
  - Ingress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
          app.kubernetes.io/name: vexplain
    ports:
    - port: 8080
      protocol: TCP
