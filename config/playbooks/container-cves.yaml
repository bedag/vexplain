apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Playbook
metadata:
  name: container-cves
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
spec:
  # The subjects are the images that run: each digest that the workloads collector reports in presence.
  subjects:
    collector: workloads
    type: ch.bedag.vexplain.presence.v1alpha1
  # The findings come from the matcher, which matches the packages of the scanner's evidence about each
  # platform manifest against its vulnerability database.
  findings:
    collector: matcher
  # The evidence that the rules read, under the name of their inputs: what the scanner found in each
  # platform manifest. Its coverage is the scanner's completeness, the share of the image's ELF files
  # that packages own.
  evidence:
  - name: contents
    collector: scanner
    type: ch.bedag.vexplain.scanner.image-contents.v1alpha1
  # The default rules. When several apply to one finding, the most cautious status wins, so their order
  # doesn't change the result.
  pipeline:
  - rule: known-exploited
  - rule: completeness-guard
  - rule: removed-in-later-layer
  - rule: load-check
