---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: imageinventories.inventory.vexplain.bedag.ch
spec:
  group: inventory.vexplain.bedag.ch
  names:
    kind: ImageInventory
    listKind: ImageInventoryList
    plural: imageinventories
    singular: imageinventory
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.digest
      name: Digest
      type: string
    - jsonPath: .status.digestKind
      name: Kind
      type: string
    - jsonPath: .status.clusters[*].cluster
      name: Clusters
      type: string
    - jsonPath: .status.facts.scannedTime
      name: Scanned
      type: date
    - jsonPath: .status.facts.failure.reason
      name: Failure
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageInventory records one reported image digest, and the clusters in which it runs. Its status
          also holds the facts that the scans of the digest found.
          It is cluster-scoped. Its name is the digest with ':' replaced by '-'.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the digest that this object describes
            properties:
              digest:
                description: |-
                  digest is the digest the container runtime reports for running containers:
                  a repository digest (often a multi-arch index) or an image ID.
                maxLength: 71
                minLength: 1
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
                x-kubernetes-validations:
                - message: digest is immutable
                  rule: self == oldSelf
            required:
            - digest
            type: object
          status:
            description: status defines the observed state of ImageInventory
            properties:
              clusters:
                description: clusters has one entry for every cluster in which the
                  digest runs.
                items:
                  description: ClusterPresence says how a digest runs in one cluster.
                  properties:
                    cluster:
                      description: cluster is the name of the cluster, as set in its
                        OperatorConfig.
                      maxLength: 63
                      minLength: 1
                      type: string
                    clusterID:
                      description: |-
                        clusterID is the identity of the cluster. Unlike the name, it never changes, so an entry
                        written under a former name can still be matched to its cluster.
                      maxLength: 64
                      minLength: 1
                      type: string
                    firstSeenTime:
                      description: firstSeenTime is when the digest was first seen
                        running in this cluster.
                      format: date-time
                      type: string
                    namespaceCount:
                      description: namespaceCount is the number of namespaces in which
                        the digest runs.
                      format: int32
                      minimum: 0
                      type: integer
                    repositories:
                      description: repositories lists the repositories the digest
                        was pulled from.
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    workloadCount:
                      description: workloadCount is the number of workloads that run
                        the digest.
                      format: int32
                      minimum: 0
                      type: integer
                    workloads:
                      description: |-
                        workloads lists the first 100 workloads, sorted by namespace, kind and name. If it is
                        shorter than workloadCount, the full list comes from the cluster's WorkloadReports.
                      items:
                        description: WorkloadReference points to a workload, and so
                          to its WorkloadReport (phase 2).
                        properties:
                          apiGroup:
                            description: |-
                              apiGroup is the API group of the workload's kind. It is empty, or left out, for the core
                              group (bare pods).
                            maxLength: 253
                            type: string
                          kind:
                            description: kind is the kind of the workload, such as
                              Deployment.
                            maxLength: 63
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the workload.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace is the namespace of the workload.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        type: object
                      maxItems: 100
                      type: array
                      x-kubernetes-list-map-keys:
                      - namespace
                      - kind
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - cluster
                  - clusterID
                  - firstSeenTime
                  - namespaceCount
                  - workloadCount
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - cluster
                x-kubernetes-list-type: map
              digestKind:
                description: 'digestKind says what the digest is: a repository digest
                  or an image ID. More values may follow.'
                enum:
                - RepoDigest
                - ImageID
                type: string
              facts:
                description: facts holds what the scans of the digest found. The scanning
                  spoke writes it.
                properties:
                  failure:
                    description: |-
                      failure says why the last scan failed, when scans have failed since the last success. A
                      success clears it.
                    properties:
                      attempts:
                        description: |-
                          attempts is how many scans of the digest have failed in a row, the last one included. It is at
                          least 1.
                        format: int32
                        minimum: 1
                        type: integer
                      reason:
                        description: reason says why the last scan failed. More values
                          may follow.
                        enum:
                        - NotPullable
                        - PullFailed
                        - Unauthorized
                        - NotFound
                        - NoMatchingPlatform
                        - TooLarge
                        - CatalogFailed
                        - TimedOut
                        - Internal
                        type: string
                      time:
                        description: time is when the last failed scan ended.
                        format: date-time
                        type: string
                    required:
                    - attempts
                    - reason
                    - time
                    type: object
                  platforms:
                    description: |-
                      platforms has one entry for each platform that the last successful scan covered. A scan that
                      fails leaves it as it was.
                    items:
                      description: |-
                        PlatformFacts holds what the scan found in one platform of an image: the figures that a reader
                        needs without decoding the evidence.
                      properties:
                        completenessPercent:
                          description: |-
                            completenessPercent is the share of the platform's ELF files that packages account for, from 0
                            to 100, rounded down.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        elfFiles:
                          description: elfFiles is the number of ELF files in the
                            platform's filesystem.
                          format: int32
                          minimum: 0
                          type: integer
                        manifestDigest:
                          description: |-
                            manifestDigest is the digest of the platform's manifest. Its evidence is the ImagePackages that
                            has the digest as its name, with ':' replaced by '-', and its findings are the ImageVerdicts
                            with the same name.
                          maxLength: 71
                          minLength: 1
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        packages:
                          description: packages is the number of packages that the
                            scan found in the platform.
                          format: int32
                          minimum: 0
                          type: integer
                        platform:
                          description: |-
                            platform is the platform of the manifest, as os/architecture, or os/architecture/variant when
                            the manifest has one, such as linux/arm64/v8.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$
                          type: string
                      required:
                      - completenessPercent
                      - elfFiles
                      - manifestDigest
                      - packages
                      - platform
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - platform
                    x-kubernetes-list-type: map
                  scannedTime:
                    description: scannedTime is when the last successful scan finished.
                    format: date-time
                    type: string
                  scannerImage:
                    description: scannerImage is the image of the scanner that made
                      the last successful scan.
                    maxLength: 512
                    type: string
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be the digest with ':' replaced by '-'
          rule: self.metadata.name == self.spec.digest.replace(':', '-')
    served: true
    storage: true
    subresources:
      status: {}
