---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: imageinventories.inventory.vexplain.bedag.ch
spec:
  group: inventory.vexplain.bedag.ch
  names:
    kind: ImageInventory
    listKind: ImageInventoryList
    plural: imageinventories
    singular: imageinventory
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.digest
      name: Digest
      type: string
    - jsonPath: .status.digestKind
      name: Kind
      type: string
    - jsonPath: .status.clusters[*].cluster
      name: Clusters
      type: string
    - jsonPath: .status.facts.manifests[*].platform
      name: Platforms
      type: string
    - jsonPath: .status.facts.failures[*].reason
      name: Failures
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ImageInventory records one reported image digest, and the clusters in which it runs. Its status
          also holds the facts that the evidence of the digest says.
          It is cluster-scoped. Its name is the digest with ':' replaced by '-'.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the digest that this object describes
            properties:
              digest:
                description: |-
                  digest is the digest the container runtime reports for running containers:
                  a repository digest (often a multi-arch index) or an image ID.
                maxLength: 71
                minLength: 1
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
                x-kubernetes-validations:
                - message: digest is immutable
                  rule: self == oldSelf
            required:
            - digest
            type: object
          status:
            description: status defines the observed state of ImageInventory
            properties:
              clusters:
                description: clusters has one entry for every cluster in which the
                  digest runs.
                items:
                  description: ClusterPresence says how a digest runs in one cluster.
                  properties:
                    cluster:
                      description: cluster is the name of the cluster, as set in its
                        OperatorConfig.
                      maxLength: 63
                      minLength: 1
                      type: string
                    clusterID:
                      description: |-
                        clusterID is the identity of the cluster. Unlike the name, it never changes, so an entry
                        written under a former name can still be matched to its cluster.
                      maxLength: 64
                      minLength: 1
                      type: string
                    exposure:
                      description: |-
                        exposure is how far the workloads that run the digest in this cluster can be reached: the highest of
                        their exposures, with Unknown counted above Controlled, since a workload whose exposure is unknown
                        may be open. It is the system exposure of SSVC's deployer tree. It is empty until the cluster's
                        collectors of exposure have said what they know. More values may follow.
                      enum:
                      - Small
                      - Controlled
                      - Open
                      - Unknown
                      type: string
                    firstSeenTime:
                      description: firstSeenTime is when the digest was first seen
                        running in this cluster.
                      format: date-time
                      type: string
                    namespaceCount:
                      description: namespaceCount is the number of namespaces in which
                        the digest runs.
                      format: int32
                      minimum: 0
                      type: integer
                    platforms:
                      description: |-
                        platforms lists the platforms that the pods which run the digest in this cluster run on, from
                        their nodes, as os/architecture, or os/architecture/variant when the node has one. It holds at
                        most 8. The hub asks for the evidence of the image again when it lists a platform that no
                        manifest of the facts covers: at once for a platform that its last such request wasn't for, and
                        otherwise with the backoff of failed attempts, a day at most, since an image may not offer every
                        platform. It is empty when the cluster doesn't say, and then asks for nothing.
                      items:
                        maxLength: 64
                        minLength: 1
                        pattern: ^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$
                        type: string
                      maxItems: 8
                      type: array
                      x-kubernetes-list-type: set
                    repositories:
                      description: repositories lists the repositories the digest
                        was pulled from.
                      items:
                        maxLength: 255
                        type: string
                      maxItems: 32
                      type: array
                      x-kubernetes-list-type: set
                    workloadCount:
                      description: workloadCount is the number of workloads that run
                        the digest.
                      format: int32
                      minimum: 0
                      type: integer
                    workloads:
                      description: |-
                        workloads lists the first 100 workloads, sorted by namespace, kind and name. If it is
                        shorter than workloadCount, the full list comes from the cluster's WorkloadReports.
                      items:
                        description: WorkloadReference points to a workload, and so
                          to its WorkloadReport (phase 2).
                        properties:
                          apiGroup:
                            description: |-
                              apiGroup is the API group of the workload's kind. It is empty, or left out, for the core
                              group (bare pods).
                            maxLength: 253
                            type: string
                          kind:
                            description: kind is the kind of the workload, such as
                              Deployment.
                            maxLength: 63
                            minLength: 1
                            type: string
                          name:
                            description: name is the name of the workload.
                            maxLength: 253
                            minLength: 1
                            type: string
                          namespace:
                            description: namespace is the namespace of the workload.
                            maxLength: 63
                            minLength: 1
                            type: string
                        required:
                        - kind
                        - name
                        - namespace
                        type: object
                      maxItems: 100
                      type: array
                      x-kubernetes-list-map-keys:
                      - namespace
                      - kind
                      - name
                      x-kubernetes-list-type: map
                  required:
                  - cluster
                  - clusterID
                  - firstSeenTime
                  - namespaceCount
                  - workloadCount
                  type: object
                maxItems: 256
                type: array
                x-kubernetes-list-map-keys:
                - cluster
                x-kubernetes-list-type: map
              digestKind:
                description: 'digestKind says what the digest is: a repository digest
                  or an image ID. More values may follow.'
                enum:
                - RepoDigest
                - ImageID
                type: string
              facts:
                description: |-
                  facts holds what the evidence of the digest says about it: its manifests, what evidence there
                  is, and why the attempts of a collector to collect it failed.
                properties:
                  evidence:
                    description: |-
                      evidence has one entry for each source and type of evidence about the image or its manifests:
                      the version of the collector, the time and the coverage of its last success.
                    items:
                      description: |-
                        EvidenceFact says what evidence of one source and type there is about an image or its manifests,
                        so that a reader learns it without knowing the type.
                      properties:
                        collectorVersion:
                          description: collectorVersion is the version of the collector
                            that delivered the evidence.
                          maxLength: 128
                          minLength: 1
                          type: string
                        coverage:
                          description: |-
                            coverage is how much of its subject the evidence covers, as a whole-number percentage from 0 to
                            100. When there are several pieces of it, it is the lowest of their coverages, and it is absent
                            when one of them has none. The core shows it and never interprets it: each type says what it
                            counts. For the scanner's evidence, it is the share of the ELF files of the image that packages
                            own.
                          format: int32
                          maximum: 100
                          minimum: 0
                          type: integer
                        source:
                          description: source is the name of the Collector that delivered
                            the evidence.
                          maxLength: 44
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        time:
                          description: |-
                            time is when the collector saw what the evidence is about. When there are several pieces of
                            it, such as one for each platform manifest, it is the earliest of their times.
                          format: date-time
                          type: string
                        type:
                          description: |-
                            type is the type of the evidence, named in reverse-DNS with a version, such as
                            ch.bedag.vexplain.scanner.image-contents.v1alpha1.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+\.v[0-9]+((alpha|beta)[0-9]+)?$
                          type: string
                      required:
                      - collectorVersion
                      - source
                      - time
                      - type
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - source
                    - type
                    x-kubernetes-list-type: map
                  failures:
                    description: |-
                      failures has one entry for each source whose attempts have failed since its last success: why
                      its last attempt failed, and how many have failed in a row. A failure of one source neither
                      replaces another's nor starts its count again, and a success of a source removes its entry.
                    items:
                      description: |-
                        ScanFailure says that the attempts of a collector to deliver evidence about the digest have failed
                        since its last success, and why the last one did.
                      properties:
                        attempts:
                          description: |-
                            attempts is how many attempts of the collector have failed in a row, the last one included. It
                            is at least 1.
                          format: int32
                          minimum: 1
                          type: integer
                        message:
                          description: |-
                            message says more about why the last attempt failed. The collector chose it, so it is data:
                            nothing that reads it takes an instruction from it. It is absent when the collector said
                            nothing more.
                          maxLength: 256
                          minLength: 1
                          type: string
                        reason:
                          description: reason says why the last attempt failed. More
                            values may follow.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[A-Z][A-Za-z0-9]*$
                          type: string
                        source:
                          description: source is the name of the Collector whose attempts
                            failed.
                          maxLength: 44
                          minLength: 1
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        time:
                          description: time is when the last failed attempt ended.
                          format: date-time
                          type: string
                      required:
                      - attempts
                      - reason
                      - source
                      - time
                      type: object
                    maxItems: 8
                    type: array
                    x-kubernetes-list-map-keys:
                    - source
                    x-kubernetes-list-type: map
                  manifests:
                    description: |-
                      manifests has one entry for each platform of the image that the evidence names, with the
                      digest of its manifest. One manifest can be listed under two platforms, as an index can list it
                      under linux/arm64 and under linux/arm64/v8. They are the manifests that the last success that
                      named any found: a success of a source that names manifests replaces the list, since the scan
                      of an image says which of its manifests run. A failure leaves them as they were.
                    items:
                      description: ManifestFact is one platform manifest of an image,
                        as its evidence names it.
                      properties:
                        digest:
                          description: |-
                            digest is the digest of the platform's manifest. The evidence about it has the subject
                            manifest/ and the digest, and its findings are the ImageVerdicts named after the digest, with
                            ':' replaced by '-'.
                          maxLength: 71
                          minLength: 1
                          pattern: ^sha256:[a-f0-9]{64}$
                          type: string
                        platform:
                          description: |-
                            platform is the platform of the manifest, as os/architecture, or os/architecture/variant when
                            the manifest has one, such as linux/arm64/v8.
                          maxLength: 64
                          minLength: 1
                          pattern: ^[a-z0-9]+/[a-z0-9_]+(/[a-z0-9]+)?$
                          type: string
                      required:
                      - digest
                      - platform
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - platform
                    x-kubernetes-list-type: map
                type: object
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be the digest with ':' replaced by '-'
          rule: self.metadata.name == self.spec.digest.replace(':', '-')
    served: true
    storage: true
    subresources:
      status: {}
