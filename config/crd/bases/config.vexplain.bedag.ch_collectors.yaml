---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: collectors.config.vexplain.bedag.ch
spec:
  group: config.vexplain.bedag.ch
  names:
    kind: Collector
    listKind: CollectorList
    plural: collectors
    singular: collector
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.version
      name: Version
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastSuccessTime
      name: Last Success
      type: date
    - jsonPath: .spec.package
      name: Package
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Collector installs one collector, a source of evidence, from its package. It is cluster-scoped, and
          installed means enabled: deleting the Collector removes the collector, and the evidence that it
          delivered.

          A Collector is named with a DNS-1123 label, because playbooks name the collectors that they read,
          and with at most 44 characters, because the operator names the Service of the collector
          vexplain-collector-<name>. That name is a DNS-1035 label, and so is the first label of the
          collector's TLS server name, and a label has 63 characters at most, which leaves 44 for the name.
          The status shows the digest that runs, what the collector describes itself as, and whether it works.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines which package the Collector installs, and its
              settings
            properties:
              package:
                description: |-
                  package is the OCI image that holds the collector, referenced by tag or by digest, such as
                  artifacts.example/collectors/hello:0.1.0. Upgrading the collector means changing it, and
                  changing it back is the rollback. The digest that actually runs is in status.packageDigest.
                maxLength: 512
                minLength: 1
                type: string
              runtimeConfigRef:
                description: |-
                  runtimeConfigRef names the CollectorRuntimeConfig that shapes the collector's Deployment. When
                  it is absent, the config named default applies.
                properties:
                  name:
                    description: name is the name of the CollectorRuntimeConfig.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                required:
                - name
                type: object
              settings:
                description: |-
                  settings are the collector's own settings, an object of any shape: vexplain can't know the
                  settings of a collector that someone else wrote, so the schema keeps them as they are. The
                  operator checks them against the settings schema that the collector declares and with the
                  collector's own check, and reports SettingsInvalid when they fail.
                x-kubernetes-preserve-unknown-fields: true
            required:
            - package
            type: object
          status:
            description: status defines the observed state of Collector
            properties:
              capabilities:
                description: capabilities are what the collector's GetCapabilities
                  answered, bounded in size.
                properties:
                  consumes:
                    description: consumes are the types of evidence that the collector's
                      operations take as input.
                    items:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+\.v[0-9]+((alpha|beta)[0-9]+)?$
                      type: string
                    maxItems: 32
                    type: array
                    x-kubernetes-list-type: set
                  operations:
                    description: operations are the work that the collector does on
                      demand.
                    items:
                      description: CollectorOperation is work that a collector does
                        on demand, for one subject.
                      properties:
                        consumes:
                          description: |-
                            consumes are the types of evidence that the operation takes as input. vexplain gets the evidence
                            of these types for the subject before it runs the operation.
                          items:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+\.v[0-9]+((alpha|beta)[0-9]+)?$
                            type: string
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: set
                        name:
                          description: name is the name of the operation, which is
                            unique in the collector.
                          maxLength: 63
                          minLength: 1
                          type: string
                        produces:
                          description: produces are the types of evidence that the
                            operation returns.
                          items:
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+\.v[0-9]+((alpha|beta)[0-9]+)?$
                            type: string
                          maxItems: 32
                          type: array
                          x-kubernetes-list-type: set
                      required:
                      - name
                      type: object
                    maxItems: 16
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  produces:
                    description: produces are the types of evidence that the collector
                      produces, each with its scope.
                    items:
                      description: ProducedType is a type of evidence that a collector
                        produces.
                      properties:
                        scope:
                          description: |-
                            scope says where the evidence of the type goes: to the hub, or nowhere but its cluster. More
                            values may follow.
                          enum:
                          - Spoke
                          - Hub
                          type: string
                        type:
                          description: |-
                            type is the type of the evidence, named in reverse-DNS with a version, such as
                            ch.bedag.vexplain.presence.v1alpha1.
                          maxLength: 253
                          minLength: 1
                          pattern: ^[a-z0-9-]+(\.[a-z0-9-]+)+\.v[0-9]+((alpha|beta)[0-9]+)?$
                          type: string
                      required:
                      - scope
                      - type
                      type: object
                    maxItems: 32
                    type: array
                    x-kubernetes-list-map-keys:
                    - type
                    x-kubernetes-list-type: map
                  roles:
                    description: |-
                      roles are where the collector runs: in a cluster next to its workloads, in the hub's cluster,
                      or both. More values may follow.
                    items:
                      description: CollectorRole says where a collector runs. Open
                        enum; more values may follow.
                      enum:
                      - Spoke
                      - Hub
                      type: string
                    maxItems: 2
                    type: array
                    x-kubernetes-list-type: set
                  watch:
                    description: watch says whether the collector streams its evidence.
                      More values may follow.
                    enum:
                    - Supported
                    - NotSupported
                    type: string
                required:
                - watch
                type: object
              conditions:
                description: |-
                  conditions represent the current state of the Collector.
                  The Ready condition says whether the collector works. It is True with reason Healthy when the
                  collector is healthy, and False with reason CollectorFailing, and the error as its message,
                  when it is failing. It is Unknown with reason NoData until the collector has reported its
                  health, and with reason Progressing while its Deployment isn't available yet.
                  The other reasons of False say why the collector can't be used: PackageInvalid when its answer
                  to GetInfo or GetCapabilities is malformed, IncompatibleAPI when it speaks no version of the
                  collector API that the operator knows, SettingsInvalid when spec.settings fail the collector's
                  check, MissingPermissions when its service account lacks permissions that it declares, and
                  RuntimeConfigInvalid when its runtime config can't be applied. The message says what.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSuccessTime:
                description: |-
                  lastSuccessTime is when the collector last reported a success. A later failure leaves it as it
                  was, and so does a restart of the operator. The operator keeps health in memory, so after a
                  restart the field keeps its value until the collector reports a success.
                format: date-time
                type: string
              packageDigest:
                description: |-
                  packageDigest is the digest of the image that runs, as the collector's pod reports it. It
                  differs from spec.package when that names a tag.
                maxLength: 71
                minLength: 1
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              version:
                description: |-
                  version is the version that the collector's GetInfo answered. Evidence is written at this
                  version, so a new version replaces what an older one delivered.
                maxLength: 128
                minLength: 1
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a Collector is named with a DNS-1123 label, which has no dots
          rule: self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: a Collector's name is at most 44 characters, because the Service
            vexplain-collector-<name> is a DNS-1035 label of at most 63 characters,
            and so is the first label of the collector's TLS server name
          rule: size(self.metadata.name) <= 44
    served: true
    storage: true
    subresources:
      status: {}
