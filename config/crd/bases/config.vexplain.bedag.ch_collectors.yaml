---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: collectors.config.vexplain.bedag.ch
spec:
  group: config.vexplain.bedag.ch
  names:
    kind: Collector
    listKind: CollectorList
    plural: collectors
    singular: collector
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Reason
      type: string
    - jsonPath: .status.lastSuccessTime
      name: Last Success
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Collector is one source of data for the operator. It is cluster-scoped, and there is one per
          type, named after the type in lower case: the Workloads collector is named workloads, and the
          Scanner collector is named scanner.

          The operator creates the default Collectors when it starts, and never overwrites one that
          exists. A Collector reports health: its status shows whether the collector works and when it
          last succeeded. The Scanner Collector also holds the settings of the scan Jobs. Deleting the
          workloads Collector does not stop the pod inventory. The operator creates a default Collector
          again the next time it starts.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines which collector this is, and its settings
            properties:
              scanner:
                description: |-
                  scanner holds the settings of the Scanner collector. It must be set when type is Scanner, and
                  must not be set for any other type.
                properties:
                  maxConcurrentScans:
                    default: 2
                    description: maxConcurrentScans is how many scan Jobs may run
                      at once. It defaults to 2.
                    format: int32
                    maximum: 32
                    minimum: 1
                    type: integer
                  memoryLimitMebibytes:
                    default: 2048
                    description: |-
                      memoryLimitMebibytes is the memory limit of a scan Job's container, in mebibytes. It defaults
                      to 2048.
                    format: int32
                    maximum: 65536
                    minimum: 256
                    type: integer
                  scanTimeoutSeconds:
                    default: 1800
                    description: |-
                      scanTimeoutSeconds is how long a scan Job may run before it is stopped, in seconds. It
                      defaults to 1800.
                    format: int32
                    maximum: 21600
                    minimum: 60
                    type: integer
                  workspaceMebibytes:
                    default: 10240
                    description: |-
                      workspaceMebibytes is the size of the scratch volume an image is unpacked into, in mebibytes,
                      and so the largest unpacked image a scan accepts. It defaults to 10240.
                    format: int32
                    maximum: 1048576
                    minimum: 1024
                    type: integer
                type: object
              type:
                description: type says which collector this is. More values may follow.
                enum:
                - Workloads
                - Scanner
                type: string
              workloads:
                description: |-
                  workloads holds the settings of the Workloads collector. It must be set when type is
                  Workloads, and must not be set for any other type.
                type: object
            required:
            - type
            type: object
            x-kubernetes-validations:
            - message: workloads must be set exactly when type is Workloads
              rule: has(self.workloads) == (self.type == 'Workloads')
            - message: scanner must be set exactly when type is Scanner
              rule: has(self.scanner) == (self.type == 'Scanner')
          status:
            description: status defines the observed state of Collector
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the Collector.
                  The Ready condition says whether the collector works. It is True with reason Healthy when
                  the collector's last report was a success, and False with reason CollectorFailing, and the
                  error as its message, when the last report was a failure. It is Unknown with reason NoData
                  until the collector has reported since the operator started. It is False with reason
                  UnknownValue when spec.type is a type that this version of the operator does not know.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSuccessTime:
                description: |-
                  lastSuccessTime is when the collector last reported a success. A later failure leaves it
                  as it was, and so does a restart of the operator. The operator keeps health in memory, so
                  after a restart the field keeps its value until the collector reports a success.
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a Collector is named after its type, in lower case
          rule: self.metadata.name == self.spec.type.lowerAscii()
    served: true
    storage: true
    subresources:
      status: {}
