---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: vexstatements.triage.vexplain.bedag.ch
spec:
  group: triage.vexplain.bedag.ch
  names:
    categories:
    - vexplain
    kind: VexStatement
    listKind: VexStatementList
    plural: vexstatements
    singular: vexstatement
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.vulnerabilityID
      name: Vulnerability
      type: string
    - jsonPath: .spec.status
      name: Status
      type: string
    - jsonPath: .spec.review.state
      name: Review
      type: string
    - jsonPath: .status.conditions[?(@.type=="Superseded")].status
      name: Superseded
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VexStatement is an agent's verdict that would silence a case, NotAffected or Fixed, which a person reviews (design of
          the agent on image cases, 5.10). The hub proposes it, never a person, one for each verdict: it is named after the
          case's Assessment and the verdict (cases.StatementName), and labelled as the Assessment is. Until a person accepts
          it, it settles nothing; once accepted, it settles the case's findings while it stands. It is superseded once the
          case's inputs change, or its Assessment holds another verdict, and stays so, with its review: the hub deletes no
          statement, since reviews can't be rebuilt.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec is the statement and its review
            properties:
              assessmentRef:
                description: assessmentRef names the Assessment whose verdict the
                  statement is.
                properties:
                  name:
                    description: name is the name of the Assessment.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - name
                type: object
              inputHash:
                description: |-
                  inputHash is the inputHash of the Assessment's verdict: what it rests on. Once the case's inputs differ, the
                  statement is superseded.
                maxLength: 71
                minLength: 71
                pattern: ^sha256:[a-f0-9]{64}$
                type: string
              justification:
                description: justification says why the case is NotAffected. It is
                  set exactly then.
                enum:
                - ComponentNotPresent
                - VulnerableCodeNotPresent
                - VulnerableCodeNotInExecutePath
                - VulnerableCodeCannotBeControlledByAdversary
                - InlineMitigationsAlreadyExist
                type: string
              origin:
                description: 'origin says who made the statement: Agent. More values
                  may follow.'
                enum:
                - Agent
                type: string
              review:
                default: {}
                description: review is a person's review of the statement, the one
                  part of it that reviewers edit. It starts Proposed.
                properties:
                  comment:
                    description: comment says why the reviewer accepted or rejected
                      the statement.
                    maxLength: 2048
                    minLength: 1
                    type: string
                  state:
                    default: Proposed
                    description: |-
                      state is where the review stands: Proposed until a person accepts or rejects the statement. More values may
                      follow.
                    enum:
                    - Proposed
                    - Accepted
                    - Rejected
                    type: string
                type: object
                x-kubernetes-validations:
                - message: a review that accepts or rejects a statement says why in
                    its comment
                  rule: '!has(self.state) || self.state == ''Proposed'' || has(self.comment)'
              status:
                description: |-
                  status is what the statement says of every finding of the vulnerability in the subject: NotAffected or Fixed. More
                  values may follow.
                enum:
                - Affected
                - UnderInvestigation
                - NotAffected
                - Fixed
                type: string
              subject:
                description: subject is the subject of the case.
                properties:
                  containerImage:
                    description: |-
                      containerImage names the image of one platform that the case is about. It is set exactly when type is
                      ContainerImage.
                    properties:
                      digest:
                        description: digest is the digest of the image's platform
                          manifest.
                        maxLength: 71
                        minLength: 71
                        pattern: ^sha256:[a-f0-9]{64}$
                        type: string
                    required:
                    - digest
                    type: object
                  type:
                    description: 'type is the kind of subject: ContainerImage. More
                      values may follow.'
                    enum:
                    - ContainerImage
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: containerImage is set exactly when type is ContainerImage
                  rule: has(self.containerImage) == (self.type == 'ContainerImage')
              vulnerabilityID:
                description: vulnerabilityID is the ID of the vulnerability, as the
                  subject's findings name it.
                maxLength: 64
                minLength: 1
                type: string
            required:
            - assessmentRef
            - inputHash
            - origin
            - status
            - subject
            - vulnerabilityID
            type: object
            x-kubernetes-validations:
            - message: a VexStatement states NotAffected or Fixed
              rule: self.status == 'NotAffected' || self.status == 'Fixed'
            - message: justification is set exactly when status is NotAffected
              rule: has(self.justification) == (self.status == 'NotAffected')
            - message: 'only the review of a VexStatement can change: another statement
                is another VexStatement'
              rule: self.subject == oldSelf.subject && self.vulnerabilityID == oldSelf.vulnerabilityID
                && self.status == oldSelf.status && has(self.justification) == has(oldSelf.justification)
                && (!has(self.justification) || self.justification == oldSelf.justification)
                && self.origin == oldSelf.origin && self.assessmentRef == oldSelf.assessmentRef
                && self.inputHash == oldSelf.inputHash
          status:
            description: status says whether the statement stands
            properties:
              conditions:
                description: |-
                  conditions represent the current state of the VexStatement. Superseded is True once the statement no longer
                  stands, and False while it does. Ready is True while it stands, and False, with the reason Stale, once it is
                  superseded. Reconciling and Stalled are present only while True, and the hub sets neither.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: observedGeneration is the generation of the VexStatement
                  that the hub last acted on.
                format: int64
                minimum: 0
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
