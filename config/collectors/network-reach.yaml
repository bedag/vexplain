apiVersion: config.vexplain.bedag.ch/v1alpha1
kind: Collector
metadata:
  name: network-reach
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
spec:
  # The network-reach collector reports how far each workload in the scope of the OperatorConfig can be reached: from
  # outside the cluster, through Services, Ingresses and the Gateway API's routes; from the rest of the cluster, as
  # NetworkPolicies and Cilium's policies allow; and one hop behind an exposed workload. It has no settings here, so
  # everything that faces outside counts as external, which errs towards urgency: its settings name the ingress
  # classes, the Gateways, the annotations of internal load balancers and whether node ports face outside.
  package: network-reach:latest
