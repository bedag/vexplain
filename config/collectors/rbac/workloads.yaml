# The workloads collector lists and watches, across the cluster, the pods, their namespaces and nodes, the
# ReplicaSets and Jobs through which it finds a pod's workload, and the Deployments, StatefulSets, DaemonSets and
# CronJobs whose own labels it reports. It reads all of them but the pods as metadata, and writes nothing.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vexplain-collector-workloads
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - namespaces
  - nodes
  verbs:
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - replicasets
  - deployments
  - statefulsets
  - daemonsets
  verbs:
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  - cronjobs
  verbs:
  - list
  - watch
---
# The service account is the one that the operator makes for the Collector workloads, in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vexplain-collector-workloads
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vexplain-collector-workloads
subjects:
- kind: ServiceAccount
  name: vexplain-collector-workloads
  namespace: vexplain-system
