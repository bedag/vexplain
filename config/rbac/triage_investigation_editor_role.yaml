# This rule is not used by the project vexplain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete Investigations, which ask the agent to judge cases. Whoever holds it
# in a namespace spends tokens, and reads in an Investigation's status where findings run across the fleet, with their
# owners. Bind it in a namespace with a RoleBinding. It carries no aggregation label, so Kubernetes' edit and admin roles
# don't grant it.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: triage-investigation-editor-role
rules:
- apiGroups:
  - triage.vexplain.bedag.ch
  resources:
  - investigations
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - triage.vexplain.bedag.ch
  resources:
  - investigations/status
  verbs:
  - get
