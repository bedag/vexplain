resources:
# All RBAC will be applied under this service account in
# the deployment namespace. You may comment out this resource
# if your manager will use a service account that exists at
# runtime. Be sure to update RoleBinding and ClusterRoleBinding
# subjects if changing service account names.
- service_account.yaml
- role.yaml
- role_binding.yaml
# role.yaml also holds a Role for the Secrets of the operator namespace, which this binds.
- manager_secrets_rolebinding.yaml
# The ceilings of what the operator grants the collectors, which the manager holds, and their defaults: what the
# built-in collectors declare.
- collector.yaml
- leader_election_role.yaml
- leader_election_role_binding.yaml
# The following RBAC configurations are used to protect
# the metrics endpoint with authn/authz. These configurations
# ensure that only authorized users and service accounts
# can access the metrics endpoint. Comment the following
# permissions if you want to disable this protection.
# More info: https://book.kubebuilder.io/reference/metrics.html
- metrics_auth_role.yaml
- metrics_auth_role_binding.yaml
- metrics_reader_role.yaml
# For each CRD, "Admin", "Editor" and "Viewer" roles are scaffolded by
# default, aiding admins in cluster management. Those roles are
# not used by the vexplain itself. You can comment the following lines
# if you do not want those helpers be installed with your Project.
- triage_workloadreport_admin_role.yaml
- triage_workloadreport_editor_role.yaml
- triage_workloadreport_viewer_role.yaml
# The inventory group is written only by the operator (design 6.1): whoever
# could write Evidence could write evidence that settles findings. So its
# kinds get viewer roles only, and no admin or editor role.
- inventory_evidence_viewer_role.yaml
- inventory_imageverdicts_viewer_role.yaml
- inventory_imageinventory_viewer_role.yaml
- config_modelconfig_admin_role.yaml
- config_modelconfig_editor_role.yaml
- config_modelconfig_viewer_role.yaml
- config_collector_admin_role.yaml
- config_collector_editor_role.yaml
- config_collector_viewer_role.yaml
- config_collectorruntimeconfig_admin_role.yaml
- config_collectorruntimeconfig_editor_role.yaml
- config_collectorruntimeconfig_viewer_role.yaml
- config_playbook_admin_role.yaml
- config_playbook_editor_role.yaml
- config_playbook_viewer_role.yaml
- config_rule_admin_role.yaml
- config_rule_editor_role.yaml
- config_rule_viewer_role.yaml
- config_operatorconfig_admin_role.yaml
- config_operatorconfig_editor_role.yaml
- config_operatorconfig_viewer_role.yaml

