---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - config.vexplain.bedag.ch
  resources:
  - collectors
  verbs:
  - create
  - get
  - list
  - watch
- apiGroups:
  - config.vexplain.bedag.ch
  resources:
  - collectors/status
  - modelconfigs/status
  - operatorconfigs/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - config.vexplain.bedag.ch
  resources:
  - modelconfigs
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - config.vexplain.bedag.ch
  resources:
  - modelconfigs/finalizers
  verbs:
  - update
- apiGroups:
  - config.vexplain.bedag.ch
  resources:
  - operatorconfigs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - events.k8s.io
  resources:
  - events
  verbs:
  - create
  - patch
