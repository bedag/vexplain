# This rule is not used by the project vexplain itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the inventory.vexplain.bedag.ch.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: inventory-imageverdicts-editor-role
rules:
- apiGroups:
  - inventory.vexplain.bedag.ch
  resources:
  - imageverdicts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - inventory.vexplain.bedag.ch
  resources:
  - imageverdicts/status
  verbs:
  - get
