# What the scanner declares, as defaults of the ceilings in ../collector.yaml. They are separate so that a spoke, which
# runs no scanner, leaves them out, and its manager holds no read of Secrets outside its namespace and no write of Jobs
# (decision 0066). The role below is named outside vexplain-collector-*, which the grants of Collectors take: a
# Collector named scanner-defaults would otherwise replace it. The scanner gets the pods that run an image that it
# scans, their nodes, and the pull secrets and service accounts that they pull with, each by its name: get alone, so
# that no collector lists or watches a Secret, which the default deny list refuses too.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: scanner-defaults
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
    rbac.vexplain.bedag.ch/aggregate-to-collector: "true"
rules:
- apiGroups:
  - ""
  resources:
  - pods
  - nodes
  - secrets
  - serviceaccounts
  verbs:
  - get
---
# The defaults of vexplain-collector-namespaced: exactly what the built-in collectors declare for their own namespace.
# The scanner creates and deletes its scan Jobs and the Secrets of the credentials that they pull with, and reads the
# Jobs' pods and logs, where a scan leaves its result, and its own pod, whose image the Jobs run.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: collector-namespaced-defaults
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
    rbac.vexplain.bedag.ch/aggregate-to-collector-namespaced: "true"
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - get
  - list
  - watch
  - delete
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
  - delete
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
