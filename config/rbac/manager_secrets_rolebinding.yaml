# Binds the namespaced Role that controller-gen generates from the Secret marker of the
# ModelConfig controller. Markers generate no bindings, and role_binding.yaml binds only the
# ClusterRole. Without this binding the cache of Secrets gets 403, never syncs, and the manager
# exits.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: manager-secrets-rolebinding
  namespace: vexplain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
