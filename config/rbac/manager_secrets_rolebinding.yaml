# Binds the namespaced Role that controller-gen generates from the markers with
# namespace=vexplain-system: the ConfigMaps that hold the guidance of AgentProfiles, the TLS
# Secrets that the operator issues and renews, the collectors' and the agent workers', the
# Secrets of the MCP collectors' headers, which it checks, and what the deployer keeps for each
# collector: its Deployment, Service and service account, the pods whose status says which digest
# runs, and the Role and RoleBinding through which it grants the collector what it declares for its
# own namespace. Markers generate no bindings, and role_binding.yaml binds only the ClusterRole.
# Without this binding the caches of ConfigMaps and of what the deployer keeps get 403, never sync,
# and the manager exits.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: manager-secrets-rolebinding
  namespace: vexplain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
