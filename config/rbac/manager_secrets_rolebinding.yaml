# Binds the namespaced Role that controller-gen generates from the markers with
# namespace=vexplain-system: the Secrets that the ModelConfig controller reads, the collectors'
# TLS Secrets, which the operator creates and renews, and what the deployer keeps for each
# collector: its Deployment, Service and service account, and the pods whose status says which
# digest runs. Markers generate no bindings, and role_binding.yaml binds only the ClusterRole.
# Without this binding the cache of Secrets gets 403, never syncs, and the manager exits.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
  name: manager-secrets-rolebinding
  namespace: vexplain-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manager-role
subjects:
- kind: ServiceAccount
  name: controller-manager
  namespace: system
