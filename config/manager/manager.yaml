apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
    # The namespace admits only pods that meet the restricted Pod Security Standard: the manager's, the collectors'
    # and the scan pods' all do. A collector or a runtime config that weakens a pod finds its pods refused.
    pod-security.kubernetes.io/enforce: restricted
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: vexplain
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vexplain
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: vexplain
    spec:
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        # The soft limit of the Go runtime's memory, below the container's limit: the resources below say why.
        - name: GOMEMLIMIT
          value: 400MiB
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # The resources come from the measurement in docs/measurements/2026-phase2a.md:
        # - On the measurement's test set, the container peaked at 202 to 271 MiB before the evaluations shared a
        #   budget of decoded evidence and the runtime had GOMEMLIMIT, and at 156 to 168 MiB with both.
        # - Every start of the manager evaluates every manifest again, so the peak recurs.
        # - A memory request equal to the limit keeps the node from overcommitting the memory.
        # - GOMEMLIMIT, at about 78% of the limit, leaves room for the runtime's memory outside the heap, and
        #   for the binary's own pages, which the kernel otherwise evicts and reads again until the process
        #   stalls.
        # - There is no CPU limit: the runtime sets GOMAXPROCS from it, and the health probe and the leader
        #   lease share that budget with the evaluations. A cluster that requires a CPU limit should give at
        #   least 1 CPU.
        resources:
          limits:
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 512Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
