# The default rules, in CEL: phase 2a's four and fix-available, which decide each finding (decision 0033), and the
# three exposure rules, which decide each workload's exposure as the spoke does (decision 0059). The default playbook,
# container-cves, runs them as its steps. Their order here is the playbook's, and doesn't change what they decide: the
# most cautious status, and the highest exposure, win, whatever the order.
resources:
- known-exploited.yaml
- completeness-guard.yaml
- removed-in-later-layer.yaml
- load-check.yaml
- fix-available.yaml
- exposed-outside-cluster.yaml
- reachable-in-cluster.yaml
- own-namespace-only.yaml
