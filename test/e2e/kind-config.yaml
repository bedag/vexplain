# The kind cluster of the e2e tests (make setup-test-e2e).
#
# The nodes' containerd reads one hosts.toml per registry from /etc/containerd/certs.d. The target
# writes the one for the local registry, localhost:5001, so that a node pulls the images that the
# specs plant there: https://kind.sigs.k8s.io/docs/user/local-registry/
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
