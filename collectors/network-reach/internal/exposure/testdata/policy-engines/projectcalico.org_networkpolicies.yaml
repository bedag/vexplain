# A stand-in for the CustomResourceDefinition of Calico's NetworkPolicy in projectcalico.org, the group of Calico's own
# API, which an install of Calico serves as a CustomResourceDefinition in place of crd.projectcalico.org's when it runs
# without its API server. The tests install it to test that the collector finds out that the cluster serves Calico's
# policies, which it doesn't read. It has the kind's group, version, kind, plural and scope, and none of Calico's
# schema: it keeps every field.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkpolicies.projectcalico.org
spec:
  group: projectcalico.org
  names:
    kind: NetworkPolicy
    listKind: NetworkPolicyList
    plural: networkpolicies
    singular: networkpolicy
  scope: Namespaced
  versions:
  - name: v3
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
