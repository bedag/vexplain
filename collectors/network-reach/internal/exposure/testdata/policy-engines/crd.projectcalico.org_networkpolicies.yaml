# A stand-in for Calico's CustomResourceDefinition of its NetworkPolicy, which the tests install to test that the
# collector finds out that the cluster serves Calico's policies, which it doesn't read. It has Calico's group,
# version, kind, plural and scope, and none of Calico's schema: it keeps every field.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: networkpolicies.crd.projectcalico.org
spec:
  group: crd.projectcalico.org
  names:
    kind: NetworkPolicy
    listKind: NetworkPolicyList
    plural: networkpolicies
    singular: networkpolicy
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
