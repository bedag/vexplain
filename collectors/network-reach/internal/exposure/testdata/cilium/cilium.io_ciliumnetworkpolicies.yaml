# A stand-in for Cilium's CustomResourceDefinition of CiliumNetworkPolicy, which the tests install to test how the
# collector finds and watches Cilium's policies. It has Cilium's group, version, kind, plural and scope, and none of
# Cilium's schema: it keeps every field, and the collector reads the policies unstructured.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ciliumnetworkpolicies.cilium.io
spec:
  group: cilium.io
  names:
    kind: CiliumNetworkPolicy
    listKind: CiliumNetworkPolicyList
    plural: ciliumnetworkpolicies
    singular: ciliumnetworkpolicy
  scope: Namespaced
  versions:
  - name: v2
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        x-kubernetes-preserve-unknown-fields: true
